<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcola il Prezzo del Tuo Biglietto</title>

    <!-- Bootstrap -->
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css'
        integrity='sha512-b2QcS5SsA8tZodcDtGRELiGv5SaKSk1vDHDaQRda0htPYWZ6046lr3kJ5bAAQdpV2mmA/4v0wQF9MyU6/pDIAg=='
        crossorigin='anonymous' />

    <!-- Style -->
    <link rel="stylesheet" href="style.css" />

    <!-- JavaScript -->
    <script defer src="main.js"></script>
</head>

<body>
    <div class="container my-5 text-center">

        <div class="text-black fw-bold mb-4 fs-3">CALCOLA IL PREZZO DEL TUO BIGLIETTO</div>
        <form id="ticket-form" class="card shadow-lg border-0 p-4 mx-auto"
            style="max-width: 1000px; border-radius: 12px;">
            <div class="row g-3 justify-content-center">
                <div class="col-4">
                    <label for="name-field" class="form-label fw-bold mb-2 text-center d-block">Nome Cognome</label>
                    <input class="form-control" type="text" id="name-field" required autocomplete="off" />
                </div>
                <div class="col-4">
                    <label for="km-field" class="form-label fw-bold mb-2 text-center d-block">KM da percorrere</label>
                    <input class="form-control" type="number" min="1" id="km-field" required autocomplete="off" />
                </div>
                <div class="col-4">
                    <label for="age-field" class="form-label fw-bold mb-2 text-center d-block">Fascia d'età</label>
                    <select id="age-field" class="form-select" autocomplete="off">
                        <option value="minorenne">Minorenne</option>
                        <option value="maggiorenne" selected>Maggiorenne</option>
                        <option value="over65">Over 65</option>
                    </select>
                </div>

                <div class="col-12 d-flex justify-content-center gap-2 mt-4">
                    <button id="btn-submit" type="submit" class="btn btn-primary">GENERA</button>
                    <button id="btn-reset" type="reset" class="btn btn-secondary">ANNULLA</button>
                </div>

            </div>
        </form>


        <div class="container my-5 text-center">

            <div class="text-black fw-bold mb-4 fs-3 mt-5">IL TUO BIGLIETTO</div>

            <div class="card shadow-lg border-0 p-4 mx-auto" style="max-width: 1000px; border-radius: 12px;">

                <div class="border-bottom fw-bold bg-white text-start pb-2">DETTAGLIO PASSEGGERI</div>

                <div class="row g-0 align-items-stretch text-start">

                    <div class="col-3 bg-secondary text-white p-3">
                        <div class="fw-bold small">NOME PASSEGGERO</div>
                        <div class="mt-3 fw-bold" id="ticket-name">-</div>
                    </div>

                    <div class="col-2 bg-white border-bottom p-3">
                        <div class="fw-bold small text-muted">Offerta</div>
                        <div class="mt-3" id="ticket-offer">-</div>
                    </div>

                    <div class="col-2 bg-white border-bottom p-3">
                        <div class="fw-bold small text-muted">Prezzo Base</div>
                        <div class="mt-3" id="ticket-base-price">-</div>
                    </div>

                    <div class="col-2 bg-white border-bottom p-3">
                        <div class="fw-bold small text-muted">Carrozza / CP</div>
                        <div class="mt-3">Carrozza 5<br><small class="text-muted">CP: 92911</small></div>
                    </div>

                    <div class="col-3 bg-white border-bottom p-3">
                        <div class="fw-bold small text-muted">Prezzo Finale</div>
                        <div class="mt-3 fw-bold text-success fs-5" id="ticket-price">-</div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</body>

</html>
